kind = "web"
previewPath = "/tawsel-admin/"
title = "طلباتي SD Admin"
description = "An internal payment review dashboard for طلباتي SD administrators to inspect submitted transaction suffixes and confirm customer payments in real time."
version = "1.0.0"
id = "artifacts/tawsel-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/tawsel-admin/" ]
localPort = 20176

[services.development]
run = "pnpm --filter @workspace/tawsel-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tawsel-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/tawsel-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20176"
BASE_PATH = "/tawsel-admin/"
